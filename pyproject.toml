[project]
name = "vision-decider"
version = "0.1.0"
description = "Strands Decider pointer readout on the multimodal Qwen3.5 torso"
requires-python = ">=3.12"
dependencies = ["strands-decider", "transformers>=5.17", "peft>=0.21", "torch>=2.7", "pillow", "pyyaml", "fastapi", "uvicorn", "safetensors"]

[tool.setuptools.packages.find]
include = ["vision_decider*"]
